name: Pubblica l’agenda
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          API_BASE: ${{ vars.CLOUDFLARE_API_URL || 'https://agenda-ruchheim-api.ruchheim-agenda.workers.dev' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Attendi disponibilità artefatto Pages
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: publish
