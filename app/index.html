<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Calendario e preparazione degli appuntamenti della Christliche Gemeinde Ruchheim.">
<title>Agenda · Christliche Gemeinde Ruchheim</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./login.js"></script>
</head>
<body>
<section id="login-shell" class="account panel" aria-labelledby="login-title">
  <h1 id="login-title">Accedi all’agenda</h1>
  <p class="muted">Christliche Gemeinde Ruchheim</p>
  <form id="login-form">
    <label id="login-email">Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <label id="setup-code" hidden>Codice di configurazione<input name="code" type="password" maxlength="128" autocomplete="off"></label>
    <button class="primary" id="login-submit">Accedi</button>
  </form>
  <p id="login-message" role="status"></p>
  <button class="plain" id="setup-toggle" hidden>Configura amministratore</button>
</section>
<div id="protected-app" hidden>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="./" aria-label="Agenda della Christliche Gemeinde Ruchheim">
      <span class="mark" aria-hidden="true">✦</span><span>Christliche Gemeinde<small>RUCHHEIM</small></span>
    </a>
    <nav aria-label="Viste dell’agenda">
      <button data-view="agenda">Calendario</button><button data-view="prep">Preparazione</button><button data-view="team">Vista team</button>
    </nav>
    <div class="account-actions"><button type="button" class="plain" id="manage-users" hidden>Utenti</button><button type="button" class="plain" id="logout">Esci</button><button class="primary" id="new-event"><span aria-hidden="true">＋</span> Nuovo evento</button></div>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <div class="arch" aria-hidden="true"></div>
    <div class="hero-content"><p class="eyebrow">CHIESA EVANGELICA RUCHHEIM</p><h1 id="page-title">Agenda della comunità</h1>
    <p id="page-subtitle">Appuntamenti e preparazione del programma della comunità.</p></div>
  </section>
  <div id="notice" role="status" hidden></div>
  <section class="filters panel" aria-label="Filtri eventi">
    <label>Tipo di evento<select id="type-filter"><option value="">Tutti i tipi</option></select></label>
    <label>Relatore<select id="speaker-filter"><option value="">Tutti i relatori</option></select></label>
    <label>Periodo<select id="period-filter"><option value="">Tutto il programma</option><option value="future">Da oggi in poi</option><option value="past">Appuntamenti passati</option><option value="undated">Data da confermare</option><option value="custom">Intervallo personalizzato</option></select></label>
    <div id="date-filters" hidden><label>Dal<input id="from" type="date"></label><label>Al<input id="to" type="date"></label></div>
    <button class="plain" id="reset">Azzera filtri</button>
  </section>
  <section id="agenda" class="agenda">
    <article class="panel calendar">
      <div class="panel-head"><div><p class="eyebrow">PROGRAMMA</p><h2>Calendario</h2></div>
        <div class="calendar-period"><label>Mese<select id="calendar-month"></select></label><form id="year-form"><label>Anno<input id="calendar-year" type="number" min="1" max="9999" step="1" required></label><button class="plain">Vai</button></form></div>
      </div>
      <div class="monthbar"><h3 id="month-title"></h3><div class="month-controls"><button id="today" class="plain">Oggi</button><button class="square" id="prev" aria-label="Mese precedente">‹</button><button class="square" id="next" aria-label="Mese successivo">›</button></div></div>
      <div class="weekdays" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
      <div id="days" class="days" aria-labelledby="month-title"></div>
      <div id="month-events"></div>
    </article>
    <aside class="panel upcoming">
      <div class="panel-head"><div><p class="eyebrow">AGENDA</p><h2>Prossimi appuntamenti</h2></div></div>
      <div id="upcoming"></div>
      <button class="plain more" id="more" hidden>Mostra tutti gli appuntamenti →</button>
    </aside>
  </section>
  <section id="prep" class="panel standalone" hidden></section>
  <section id="team" class="panel standalone" hidden></section>
</main>
<dialog id="editor" aria-labelledby="edit-title">
  <form id="event-form">
    <div class="dialog-head"><div><p class="eyebrow">SCHEDA EVENTO</p><h2 id="edit-title"></h2></div><button type="button" class="square" id="close-editor" aria-label="Chiudi">×</button></div>
    <div id="details"></div>
    <div class="dialog-footer"><p id="form-message" role="alert"></p><button type="button" class="plain" id="cancel">Chiudi</button><button class="primary" id="save">Salva scheda</button></div>
  </form>
</dialog>
<dialog id="user-admin" aria-labelledby="users-title">
  <div class="dialog-head"><h2 id="users-title">Gestione utenti</h2><form method="dialog"><button class="square" aria-label="Chiudi">×</button></form></div>
  <div class="account-content">
    <form id="invite-form">
      <label>Email<input name="email" type="email" required maxlength="254"></label>
      <label>Permessi<select name="role"><option value="viewer">Lettura</option><option value="editor">Modifica</option></select></label>
      <button class="primary">Crea invito</button>
    </form>
    <p id="admin-message" role="status"></p>
    <label id="invite-output" hidden>Link di invito (valido 48 ore)<input id="invite-link" readonly><button class="plain" id="copy-invite">Copia link</button></label>
    <div id="account-list"></div>
  </div>
</dialog>
</div>
</body>
</html>
